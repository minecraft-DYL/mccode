<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>MC 编辑器 · Minecraft Java 版命令 / NBT / 物品组件编辑器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='5'%20fill='%230067c0'/%3E%3Cpath%20d='M12%204%204%208v8l8%204%208-4V8l-8-4Z'%20fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/vendor/winui-theme.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='5'%20fill='%230067c0'/%3E%3Cpath%20d='M12%204%204%208v8l8%204%208-4V8l-8-4Z'%20fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/vendor/winui-animations.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='5'%20fill='%230067c0'/%3E%3Cpath%20d='M12%204%204%208v8l8%204%208-4V8l-8-4Z'%20fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/app.css">
</head>
<body>
<div id="app">
  <div class="nv">
    <aside class="nv-pane">
      <div class="nv-header">
        <div class="nv-logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2Zm0 2.3 6.5 3.2L12 10.7 5.5 7.5 12 4.3Z"/></svg>
        </div>
        <div>
          <div class="nv-brand-title">MC 编辑器</div>
          <div class="nv-brand-sub" id="brandVersion">未选择版本</div>
        </div>
      </div>
      <div class="nv-search">
        <input id="navSearch" class="tb tb-search" type="text" placeholder="搜索页面…" autocomplete="off" spellcheck="false">
      </div>
      <nav class="nv-items" id="navItems" aria-label="页面导航"></nav>
      <div class="nv-footer">
        <button class="btn btn-icon btn-subtle" id="themeToggle" type="button" title="切换主题" aria-label="切换主题"></button>
        <button class="btn btn-icon btn-subtle" id="reloadRegistry" type="button" title="重新检索注册表" aria-label="重新检索注册表"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg></button>
        <span class="nv-footer-text" id="registryHint">注册表未加载</span>
      </div>
    </aside>
    <main class="nv-content">
      <header class="page-header">
        <div>
          <h1 class="page-title" id="pageTitle">概览</h1>
          <p class="page-subtitle" id="pageSubtitle"></p>
        </div>
        <div class="page-actions" id="pageActions"></div>
      </header>
      <div class="page-scroll" id="pageScroll"><div id="pageView"></div></div>
    </main>
  </div>
  <footer class="status-bar" id="statusBar" title="双击查看运行日志">
    <span class="sb-item" id="sbVersion">—</span>
    <span class="sb-sep"></span>
    <span class="sb-item" id="sbRegistry">注册表：未检索</span>
    <span class="sb-sep"></span>
    <span class="sb-item" id="sbSource">数据源：—</span>
    <span class="sb-spacer"></span>
    <span class="sb-item" id="sbClock">--:--:--</span>
  </footer>
</div>
<noscript><p style="font:14px/1.8 system-ui;padding:24px">本编辑器是纯前端 ES Module 应用，需要启用 JavaScript。</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
